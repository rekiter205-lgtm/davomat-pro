services:
  db:
    image: postgres:16-alpine
    container_name: davomat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: davomat
      # `:?` — o'rnatilmagan bo'lsa compose ishga tushmaydi. Parol faqat
      # baza birinchi marta yaratilganda qo'llaniladi; keyin o'zgartirish
      # uchun `ALTER USER davomat WITH PASSWORD '...'` kerak.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da belgilanishi shart}
      POSTGRES_DB: davomat_pro
      TZ: ${TZ:-Asia/Tashkent}
    # Port ataylab host'ga chiqarilmagan: `app` bazaga docker tarmog'i orqali
    # (db:5432) ulanadi, tashqi port kerak emas. Bazaga qo'lda kirish uchun:
    #   docker compose exec db psql -U davomat -d davomat_pro
    # Vaqtincha host'dan kerak bo'lsa (masalan Prisma Studio), quyidagini
    # yoqing — faqat localhost, hech qachon 0.0.0.0 emas:
    #   ports:
    #     - "127.0.0.1:15432:5432"
    volumes:
      - davomat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U davomat -d davomat_pro"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        # .env dagi NEXT_PUBLIC_DEMO_CREDENTIALS=1 bo'lsa login forma demo rejimda bo'ladi
        NEXT_PUBLIC_DEMO_CREDENTIALS: ${NEXT_PUBLIC_DEMO_CREDENTIALS:-0}
    container_name: davomat-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Dars vaqtlari ("08:00") server local vaqtida hisoblanadi — TZ mos
      # bo'lmasa yo'qlama oynasi noto'g'ri soatda ochiladi.
      TZ: ${TZ:-Asia/Tashkent}
      DATABASE_URL: postgresql://davomat:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da belgilanishi shart}@db:5432/davomat_pro?schema=public
      # Standart qiymat yo'q — bo'sh bo'lsa deploy to'xtaydi. Yaratish:
      #   openssl rand -base64 32
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET .env da belgilanishi shart (kamida 32 belgi)}
      JWT_EXPIRES_IN: 7d
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
      MAX_UPLOAD_SIZE_MB: 5
      FACE_MATCH_THRESHOLD: "0.55"
      LATE_THRESHOLD_MINUTES: "15"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      SMS_PROVIDER_EMAIL: ${SMS_PROVIDER_EMAIL:-}
      SMS_PROVIDER_PASSWORD: ${SMS_PROVIDER_PASSWORD:-}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      LOGIN_RATE_WINDOW_SEC: ${LOGIN_RATE_WINDOW_SEC:-60}
      RECOGNIZE_RATE_LIMIT: ${RECOGNIZE_RATE_LIMIT:-90}
      RECOGNIZE_RATE_WINDOW_SEC: ${RECOGNIZE_RATE_WINDOW_SEC:-60}
    ports:
      - "3001:3000"
    volumes:
      - davomat_uploads:/app/public/uploads
      - davomat_models:/app/public/models

  # HTTPS tunnel — telefondan yo'qlama qilish uchun.
  # Brauzer kamerani faqat xavfsiz kontekstda (HTTPS yoki localhost) beradi,
  # shuning uchun http://192.168.x.x:3001 da FaceScanner ishlamaydi.
  #
  #   docker compose --profile tunnel up -d
  #   docker compose logs tunnel | grep trycloudflare.com
  #
  # Chiqqan https://... manzilini telefonda oching. Manzil har safar
  # yangidan beriladi (Cloudflare quick tunnel, akkaunt talab qilmaydi).
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: davomat-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - app
    command: tunnel --no-autoupdate --url http://app:3000

volumes:
  davomat_pgdata:
  davomat_uploads:
  davomat_models:
